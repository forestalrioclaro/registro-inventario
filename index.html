<style>
  /* Manual de marca Río Claro: verde 7481 C (#00B255), gris Cool Gray 8 C (#898A8D), negro; tipografía Raleway (principal) y Lato (secundaria) */
  :root {
    --rc-verde: #00B255;
    --rc-gris: #898A8D;
    --rc-negro: #000000;
    --rc-azul: #2659a5;
    --rc-rojo: #bd2c2c;
    --bs-primary: #00B255;
    --bs-primary-rgb: 0, 178, 85;
    --bs-link-color: #00B255;
    --bs-font-sans-serif: 'Lato', system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif;
  }
  body { background: #f4f5f6; font-family: 'Lato', system-ui, sans-serif; color: #222; font-size: 14px; }
  h1, h2, h3, .titulo { font-family: 'Raleway', 'Lato', sans-serif; font-weight: 900; }
  .encabezado { background: #fff; border-bottom: 4px solid var(--rc-verde); }
  .encabezado img { height: 52px; width: auto; }
  .encabezado .sub { font-family: 'Raleway', sans-serif; font-weight: 700; color: var(--rc-gris); letter-spacing: .04em; font-size: 13px; text-transform: uppercase; }
  .nav-rc .btn { font-family: 'Raleway', sans-serif; font-weight: 700; font-size: 13px; border-radius: 6px; }
  .nav-rc .btn.activo { background: var(--rc-verde); border-color: var(--rc-verde); color: #fff; }
  .nav-rc .btn:not(.activo) { color: var(--rc-gris); border-color: #d0d2d4; background: #fff; }
  .card-rc { background: #fff; border: 1px solid #e2e4e6; border-radius: 10px; padding: 16px; margin-bottom: 16px; box-shadow: 0 1px 2px rgba(0,0,0,.03); }
  .card-rc h2 { font-size: 20px; color: var(--rc-verde); margin-bottom: 12px; }
  .card-rc h3 { font-size: 14px; font-weight: 700; color: var(--rc-gris); text-transform: uppercase; letter-spacing: .05em; margin: 18px 0 8px; font-family: 'Raleway', sans-serif; }
  .form-label { font-weight: 700; font-size: 12px; color: var(--rc-gris); margin-bottom: 3px; }
  .form-control, .form-select { font-size: 14px; }
  .form-control:focus, .form-select:focus { border-color: var(--rc-verde); box-shadow: 0 0 0 .15rem rgba(0,178,85,.2); }
  .tabla-conteo { font-size: 13px; }
  .tabla-conteo th { background: #f1f2f3; color: var(--rc-gris); font-family: 'Raleway', sans-serif; font-weight: 700; font-size: 12px; text-transform: uppercase; white-space: nowrap; vertical-align: middle; }
  .tabla-conteo td { padding: 2px; vertical-align: middle; }
  .tabla-conteo td.num { text-align: center; color: var(--rc-gris); width: 36px; font-weight: 700; background: #fafafa; }
  .tabla-conteo .form-control, .tabla-conteo .form-select { font-size: 13px; padding: 3px 6px; min-width: 80px; border-color: transparent; background-color: transparent; }
  .tabla-conteo .form-control:focus, .tabla-conteo .form-select:focus { background-color: #f3fbf6; border-color: var(--rc-verde); }
  .tabla-conteo .form-select { padding-right: 1.6rem; background-position: right .4rem center; }
  .tabla-conteo .c-sector, .tabla-conteo .c-comentario { min-width: 180px; }
  .tabla-conteo .c-producto, .tabla-conteo .c-clase { min-width: 100px; }
  .tabla-conteo .c-diametro { min-width: 110px; }
  .historial td, .historial th { font-size: 12px; white-space: nowrap; }
  .historial th { color: var(--rc-gris); font-family: 'Raleway', sans-serif; text-transform: uppercase; }
  .btn-rc { background: var(--rc-verde); border-color: var(--rc-verde); color: #fff; font-weight: 700; font-family: 'Raleway', sans-serif; }
  .btn-rc:hover, .btn-rc:focus { background: #009447; border-color: #009447; color: #fff; }
  .btn-rc-outline { color: var(--rc-verde); border-color: var(--rc-verde); font-weight: 700; font-family: 'Raleway', sans-serif; background: #fff; }
  .btn-rc-outline:hover { background: var(--rc-verde); border-color: var(--rc-verde); color: #fff; }
  .msg-ok { color: var(--rc-verde); font-weight: 700; }
  .msg-error { color: var(--rc-rojo); font-weight: 700; }
  details.trab summary { cursor: pointer; font-weight: 700; color: var(--rc-gris); font-family: 'Raleway', sans-serif; font-size: 13px; text-transform: uppercase; letter-spacing: .04em; }
  details.trab .grid-trab { display: grid; grid-template-columns: repeat(auto-fit, minmax(170px, 1fr)); gap: 8px; margin-top: 10px; }
  .pie { color: var(--rc-gris); font-size: 12px; text-align: center; padding: 14px 0 4px; }
  .pie b { color: var(--rc-verde); }
  .bloque-mant textarea { min-height: 110px; font-size: 13px; }
  [hidden] { display: none !important; }
</style>
</head>

        <button class="btn btn-rc" id="mant-entrar">Entrar</button>
      </div>

    </div>

        <div class="col-md-6 col-lg-3"><label class="form-label" for="m-largos">Largos</label><textarea class="form-control" id="m-largos"></textarea></div>
        <div class="col-md-6 col-lg-3"><label class="form-label" for="m-diamRCC">Diámetro RCC</label><textarea class="form-control" id="m-diamRCC"></textarea></div>

        <div class="col-md-6 col-lg-3"><label class="form-label" for="m-diamRD">Diámetro RD / RDI</label><textarea class="form-control" id="m-diamRD"></textarea></div>
        <div class="col-md-6 col-lg-3"><label class="form-label" for="m-secado">Nivel de secado</label><textarea class="form-control" id="m-secado"></textarea></div>

        <button class="btn btn-rc" id="mant-guardar">Guardar mantenedor</button>
        <span id="mant-msg"></span>
      </div>
    </div>
  </section>

function $(id) { return document.getElementById(id); }

function esc(s) {
  return String(s === null || s === undefined ? '' : s).replace(/[&<>"']/g, function (c) {
    return { '&':'&amp;', '<':'&lt;', '>':'&gt;', '"':'&quot;', "'":'&#39;' }[c];
  });
}

function hoyISO() {
  var d = new Date();
  d.setMinutes(d.getMinutes() - d.getTimezoneOffset());
  return d.toISOString().slice(0, 10);
}

function mostrarAviso(texto) { var a = $('aviso'); a.textContent = texto; a.hidden = !texto; }

function opcionesHtml(lista) {
  return '<option value=""></option>' + (lista || []).map(function (v) {
    return '<option value="' + esc(v) + '">' + esc(v) + '</option>';
  }).join('');
}

function diamOpciones(producto) {
  var p = (producto || '').trim().toUpperCase();
  if (p === 'RCC') return LISTAS.diamRCC;
  if (p === 'RC' || p === 'RCI') return LISTAS.diamRC;
  if (p === 'RD' || p === 'RDI') return LISTAS.diamRD;
  return [].concat(LISTAS.diamRCC, LISTAS.diamRC, LISTAS.diamRD).filter(function (v, i, a) { return a.indexOf(v) === i; });
}

function llamarGet(params) {
  var partes = [];
  Object.keys(params).forEach(function (k) {
    partes.push(encodeURIComponent(k) + '=' + encodeURIComponent(params[k]));
  });
  return fetch(APPS_SCRIPT_URL + '?' + partes.join('&')).then(function (r) { return r.json(); });
}

function llamarPost(cuerpo) {
  return fetch(APPS_SCRIPT_URL, {
    method: 'POST',
    headers: { 'Content-Type': 'text/plain;charset=utf-8' },
    body: JSON.stringify(cuerpo)
  }).then(function (r) { return r.json(); });
}

/* ==== LISTAS ==== */
function refrescarListas() {
  $('dl-jefes').innerHTML = LISTAS.jefes.map(function (v) { return '<option value="' + esc(v) + '"></option>'; }).join('');
  document.querySelectorAll('select[data-lista]').forEach(function (sel) {
    var prev = sel.value;
    sel.innerHTML = opcionesHtml(LISTAS[sel.getAttribute('data-lista')]);
    sel.value = prev;
  });
  document.querySelectorAll('tbody[id$="-filas"] tr').forEach(actualizarDiamFila);
}

function cargarListas() {
  return llamarGet({ action: 'lists' }).then(function (datos) {
    if (!datos.ok) throw new Error(datos.error || 'No se pudieron cargar las listas');
    LISTAS = datos;
    refrescarListas();
  });
}

/* ==== TABLA DE CARGA ==== */
function filaHtml(vid, n) {
  var id = 'r-' + vid + '-' + n;
  var h = '<tr id="' + id + '"><td class="num">' + n + '</td>';
  COLUMNAS_CARGA.forEach(function (col) {
    var clase = 'c-' + col.c;
    if (col.tipo === 'sel') {
      h += '<td><select class="form-select form-select-sm ' + clase + '" data-lista="' + col.lista + '">' + opcionesHtml(LISTAS[col.lista]) + '</select></td>';
    } else if (col.tipo === 'dl') {
      h += '<td><input class="form-control form-control-sm ' + clase + '" type="text" list="dl-d-' + id + '" autocomplete="off"></td>';
    } else if (col.tipo === 'num') {
      h += '<td><input class="form-control form-control-sm ' + clase + '" type="number" min="0" step="1"></td>';
    } else {
      h += '<td><input class="form-control form-control-sm ' + clase + '" type="text" autocomplete="off"></td>';
    }
  });
  h += '<td class="d-none"><datalist id="dl-d-' + id + '"></datalist></td></tr>';
  return h;
}

function htmlVista(v) {
  var p = v.id + '-';
  var trab = '';
  for (var i = 0; i < TRABAJADORES_MAX; i++) {
    var num = (i + 1 < 10 ? '0' : '') + (i + 1);
    trab += '<div><input class="form-control form-control-sm" id="' + p + 't' + i + '" placeholder="Trabajador ' + num + '"></div>';
  }
  var cab = '<th>Nº</th>' + COLUMNAS_CARGA.map(function (c) { return '<th>' + esc(c.t) + '</th>'; }).join('');
  var filas = '';
  for (var k = 1; k <= FILAS_INICIALES; k++) filas += filaHtml(v.id, k);
  contadorFilas[v.id] = FILAS_INICIALES;
  return '' +
  '<section id="vista-' + v.id + '" class="card-rc" hidden>' +
  '  <h2>' + esc(v.nombre) + '</h2>' +
  '  <div class="row g-3">' +
  '    <div class="col-sm-4 col-md-3 col-xl-2"><label class="form-label" for="' + p + 'fecha">Fecha</label><input type="date" class="form-control" id="' + p + 'fecha"></div>' +
  '    <div class="col-sm-8 col-md-5 col-xl-4"><label class="form-label" for="' + p + 'jefe">Jefe de área</label><input class="form-control" list="dl-jefes" id="' + p + 'jefe" placeholder="Escribe o elige"></div>' +
  '  </div>' +
  '  <details class="trab mt-3">' +
  '    <summary>Trabajadores que ayudaron a contar (ISO)</summary>' +
  '    <div class="grid-trab">' + trab + '</div>' +
  '  </details>' +
  '  <h3>Conteo</h3>' +
  '  <div class="table-responsive border rounded">' +
  '    <table class="table table-sm table-bordered tabla-conteo mb-0"><thead><tr>' + cab + '</tr></thead>' +
  '    <tbody id="' + p + 'filas">' + filas + '</tbody></table>' +
  '  </div>' +
  '  <div class="d-flex flex-wrap align-items-center gap-2 mt-3">' +
  '    <button class="btn btn-rc-outline btn-sm" id="' + p + 'agregar">Agregar ' + FILAS_NUEVAS + ' filas</button>' +
  '    <button class="btn btn-rc" id="' + p + 'btn">Guardar filas</button>' +
  '    <span id="' + p + 'msg" class="ms-2"></span>' +
  '  </div>' +
  '  <h3>Últimos registros de esta vista</h3>' +
  '  <div class="table-responsive border rounded"><table class="table table-sm table-striped historial mb-0" id="' + p + 'tabla"></table></div>' +
  '</section>';
}

function valorFila(tr, clase) {
  var el = tr.querySelector('.c-' + clase);
  return el ? (el.value || '').trim() : '';
}

function actualizarDiamFila(tr) {
  var dl = tr.querySelector('datalist');
  if (!dl) return;
  dl.innerHTML = diamOpciones(valorFila(tr, 'producto')).map(function (o) {
    return '<option value="' + esc(o) + '"></option>';
  }).join('');
}

function agregarFilas(vid, cantidad) {
  var html = '';
  for (var i = 0; i < cantidad; i++) {
    contadorFilas[vid] = (contadorFilas[vid] || 0) + 1;
    html += filaHtml(vid, contadorFilas[vid]);
  }
  $(vid + '-filas').insertAdjacentHTML('beforeend', html);
}

function limpiarFila(tr) {
  tr.querySelectorAll('input, select').forEach(function (i) { i.value = ''; });
  actualizarDiamFila(tr);
}

function valor(id) { return ($(id).value || '').trim(); }

function leerCabecera(v) {
  var p = v.id + '-';
  var trabajadores = [];
  for (var i = 0; i < TRABAJADORES_MAX; i++) {
    var t = valor(p + 't' + i);
    if (t) trabajadores.push(t);
  }
  return { vista: v.nombre, fecha: valor(p + 'fecha'), jefe: valor(p + 'jefe'), trabajadores: trabajadores };
}

function leerFilas(vid) {
  var trs = $(vid + '-filas').querySelectorAll('tr');
  var out = [];
  for (var i = 0; i < trs.length; i++) {
    var tr = trs[i];
    var datos = {};
    var vacia = true;
    COLUMNAS_CARGA.forEach(function (col) {
      var val = valorFila(tr, col.c);
      datos[col.c] = val;
      if (val !== '') vacia = false;
    });
    out.push({ n: tr.querySelector('td.num').textContent, tr: tr, datos: datos, vacia: vacia });
  }
  return out;
}

function filaValida(datos) {
  if (!datos.producto) return false;
  var unidades = [datos.produccion, datos.recuperacion, datos.rechazo];
  return unidades.some(function (u) { return u !== '' && Number(u) > 0; });
}

function guardarFilas(v) {
  var msg = $(v.id + '-msg'), btn = $(v.id + '-btn');
  var cab = leerCabecera(v);
  var filas = leerFilas(v.id).filter(function (f) { return !f.vacia; });
  msg.className = 'ms-2'; msg.textContent = '';

  if (!cab.fecha || !cab.jefe) {
    msg.className = 'ms-2 msg-error';
    msg.textContent = 'Falta la fecha o el jefe de área.';
    return;
  }
  if (filas.length === 0) {
    msg.className = 'ms-2 msg-error';
    msg.textContent = 'No hay filas con datos para guardar.';
    return;
  }
  var malas = filas.filter(function (f) { return !filaValida(f.datos); }).map(function (f) { return f.n; });
  if (malas.length) {
    msg.className = 'ms-2 msg-error';
    msg.textContent = 'Revisa las filas ' + malas.join(', ') + ': necesitan producto y al menos una cantidad.';
    return;
  }

  btn.disabled = true;
  var guardadas = 0;
  function siguiente(i) {
    if (i >= filas.length) {
      msg.className = 'ms-2 msg-ok';
      msg.textContent = 'Se guardaron ' + guardadas + ' filas.';
      cargarRecientes(v);
      btn.disabled = false;
      return Promise.resolve();
    }
    var f = filas[i];
    var data = Object.assign({}, cab, f.datos, { trabajadores: cab.trabajadores });
    return llamarPost({ action: 'registrar', data: data }).then(function (r) {
      if (!r.ok) throw new Error('fila ' + f.n + ': ' + r.error);
      guardadas++;
      limpiarFila(f.tr);
      return siguiente(i + 1);
    });
  }
  siguiente(0).catch(function (e) {
    msg.className = 'ms-2 msg-error';
    msg.textContent = 'Se guardaron ' + guardadas + ' filas. Error en ' + e.message;
    cargarRecientes(v);
    btn.disabled = false;
  });
}

function cargarRecientes(v) {
  var tabla = $(v.id + '-tabla');
  llamarGet({ action: 'recientes', vista: v.nombre }).then(function (r) {
    if (!r.ok) throw new Error(r.error);
    var cab = COLUMNAS_TABLA.map(function (c) { return '<th>' + esc(c.nombre) + '</th>'; }).join('');
    var filas = r.rows.map(function (f) {
      return '<tr>' + COLUMNAS_TABLA.map(function (c) {
        var val = f[c.idx];
        if (c.idx === 2 && val) val = String(val).slice(0, 10);
        return '<td>' + esc(val) + '</td>';
      }).join('') + '</tr>';
    }).join('');
    tabla.innerHTML = '<thead><tr>' + cab + '</tr></thead><tbody>' +
      (filas || '<tr><td>Sin registros aún</td></tr>') + '</tbody>';
  }).catch(function (e) {
    tabla.innerHTML = '<tbody><tr><td class="msg-error">No se pudieron cargar los registros: ' + esc(e.message) + '</td></tr></tbody>';
  });
}

function montarVistas() {
  $('contenedor-vistas').innerHTML = VISTAS.map(htmlVista).join('');
  VISTAS.forEach(function (v) {
    var p = v.id + '-';
    $(p + 'fecha').value = hoyISO();
    $(p + 'btn').addEventListener('click', function () { guardarFilas(v); });
    $(p + 'agregar').addEventListener('click', function () { agregarFilas(v.id, FILAS_NUEVAS); });
    $(p + 'filas').addEventListener('change', function (e) {
      if (e.target.classList.contains('c-producto')) actualizarDiamFila(e.target.closest('tr'));
    });
  });
}

/* ==== NAVEGACION ==== */
var SECCIONES = VISTAS.map(function (v) { return { id: 'vista-' + v.id, nombre: v.nombre }; });
SECCIONES.push({ id: 'vista-mantenedor', nombre: 'Mantenedor' });

function mostrarSeccion(id) {
  SECCIONES.forEach(function (s) {
    $(s.id).hidden = s.id !== id;
    var b = document.querySelector('[data-sec="' + s.id + '"]');
    if (b) b.classList.toggle('activo', s.id === id);
  });
  var v = VISTAS.filter(function (x) { return 'vista-' + x.id === id; })[0];
  if (v) cargarRecientes(v);
}

function montarNav() {
  $('nav').innerHTML = SECCIONES.map(function (s) {
    return '<button class="btn btn-sm" data-sec="' + s.id + '">' + esc(s.nombre) + '</button>';
  }).join('');
  $('nav').addEventListener('click', function (e) {
    var b = e.target.closest('button[data-sec]');
    if (b) mostrarSeccion(b.getAttribute('data-sec'));
  });
}

/* ==== MANTENEDOR ==== */
var CAMPOS_MANT = [
  ['m-jefes','jefes'], ['m-productos','productos'], ['m-clases','clases'], ['m-largos','largos'],
  ['m-diamRCC','diamRCC'], ['m-diamRC','diamRC'], ['m-diamRD','diamRD'], ['m-secado','secado']
];

function cargarEditorMantenedor() {
  CAMPOS_MANT.forEach(function (par) { $(par[0]).value = (LISTAS[par[1]] || []).join('\n'); });
}

function entrarMantenedor() {
  var clave = $('mant-clave').value;
  $('mant-login-msg').textContent = '';
  llamarPost({ action: 'verificarClave', clave: clave }).then(function (r) {
    if (!r.ok) { $('mant-login-msg').textContent = 'Clave incorrecta.'; return; }
    claveActual = clave;
    $('mant-login').hidden = true;
    $('mant-editor').hidden = false;
    cargarEditorMantenedor();
  }).catch(function (e) {
    $('mant-login-msg').textContent = 'Error de conexión: ' + e.message;
  });
}

function guardarMantenedor() {
  var listas = {};
  CAMPOS_MANT.forEach(function (par) {
    listas[par[1]] = $(par[0]).value.split('\n').map(function (s) { return s.trim(); }).filter(Boolean);
  });
  var msg = $('mant-msg');
  $('mant-guardar').disabled = true;
  msg.className = ''; msg.textContent = 'Guardando...';
  llamarPost({ action: 'guardarMantenedor', clave: claveActual, listas: listas }).then(function (r) {
    if (!r.ok) throw new Error(r.error);
    return cargarListas().then(function () {
      msg.className = 'msg-ok'; msg.textContent = 'Mantenedor guardado.';
    });
  }).catch(function (e) {
    msg.className = 'msg-error'; msg.textContent = 'No se guardó: ' + e.message;
  }).then(function () {
    $('mant-guardar').disabled = false;
  });
}

/* ==== INICIO ==== */
function iniciar() {
  montarNav();
  montarVistas();
  $('mant-entrar').addEventListener('click', entrarMantenedor);
  $('mant-clave').addEventListener('keydown', function (e) { if (e.key === 'Enter') entrarMantenedor(); });
  $('mant-guardar').addEventListener('click', guardarMantenedor);

  cargarListas().catch(function (e) {
    mostrarAviso('No se pudieron cargar las listas del mantenedor: ' + e.message);
  }).then(function () {
    mostrarSeccion('vista-' + VISTAS[0].id);
  });
}

iniciar();
</script>
