<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Registro de Inventario</title>
<style>
  :root { --azul:#1f4e79; --gris:#f3f5f7; --borde:#cfd6dd; --verde:#2e7d32; --rojo:#b71c1c; }
  * { box-sizing: border-box; }
  body { margin:0; font-family: system-ui, -apple-system, "Segoe UI", Roboto, sans-serif; background:var(--gris); color:#1b1b1b; font-size:14px; }
  header { background:var(--azul); color:#fff; padding:10px 14px; }
  header h1 { margin:0 0 8px; font-size:18px; }
  nav { display:flex; flex-wrap:wrap; gap:6px; }
  nav button { background:transparent; color:#fff; border:1px solid rgba(255,255,255,.5); border-radius:6px; padding:5px 10px; cursor:pointer; font-size:13px; }
  nav button.activo { background:#fff; color:var(--azul); font-weight:600; }
  main { padding:12px; max-width:1300px; margin:0 auto; }
  .card { background:#fff; border:1px solid var(--borde); border-radius:8px; padding:12px; margin-bottom:12px; }
  .card h2 { margin:0 0 10px; font-size:17px; color:var(--azul); }
  .card h3 { margin:14px 0 6px; font-size:14px; color:#333; }
  .cabecera { display:flex; flex-wrap:wrap; gap:10px; align-items:flex-end; }
  .cabecera label { display:flex; flex-direction:column; font-size:12px; color:#444; gap:3px; }
  .cabecera input { font-size:14px; padding:6px; border:1px solid var(--borde); border-radius:5px; width:200px; }
  details summary { cursor:pointer; font-weight:600; color:#333; margin-top:10px; }
  .grid-trab { display:grid; grid-template-columns: repeat(auto-fit, minmax(170px,1fr)); gap:6px; margin-top:6px; }
  .grid-trab input { font-size:13px; padding:5px; border:1px solid var(--borde); border-radius:5px; width:100%; }
  .tabla-wrap { overflow-x:auto; }
  table { border-collapse:collapse; width:100%; font-size:13px; }
  th, td { border:1px solid var(--borde); padding:2px 4px; text-align:left; white-space:nowrap; }
  th { background:var(--gris); font-weight:600; padding:5px 4px; }
  td.num { text-align:center; color:#666; background:#fafafa; width:34px; }
  td input { width:100%; min-width:70px; font-size:13px; padding:4px 5px; border:1px solid transparent; border-radius:3px; background:#fff; }
  td input:focus { border-color:var(--azul); outline:none; background:#f5f9ff; }
  td input.c-sector, td input.c-comentario { min-width:180px; }
  td input.c-producto, td input.c-clase { min-width:90px; }
  td input.c-diametro { min-width:100px; }
  td input[type=number] { min-width:70px; }
  .historial td, .historial th { white-space:nowrap; }
  td.comentario { white-space:normal; min-width:160px; }
  .acciones { display:flex; align-items:center; gap:10px; margin-top:10px; flex-wrap:wrap; }
  button.primario { background:var(--azul); color:#fff; border:0; border-radius:6px; padding:8px 16px; font-size:14px; cursor:pointer; }
  button.primario:disabled { opacity:.6; cursor:wait; }
  button.secundario { background:#fff; color:var(--azul); border:1px solid var(--azul); border-radius:6px; padding:6px 12px; font-size:13px; cursor:pointer; }
  .msg-ok { color:var(--verde); font-weight:600; }
  .msg-error { color:var(--rojo); font-weight:600; }
  .aviso { background:#fff3cd; border:1px solid #e0c36b; border-radius:6px; padding:8px; margin-bottom:10px; }
  .solo-mantenedor textarea { min-height:90px; font-family:inherit; width:100%; font-size:13px; padding:6px; border:1px solid var(--borde); border-radius:5px; }
  .solo-mantenedor label { display:flex; flex-direction:column; gap:4px; font-size:12px; color:#444; }
  .grid-cab { display:grid; grid-template-columns: repeat(auto-fit, minmax(220px,1fr)); gap:10px; }
  .fila-clave { display:flex; gap:8px; align-items:flex-end; max-width:420px; }
  .fila-clave input { font-size:14px; padding:6px; border:1px solid var(--borde); border-radius:5px; width:100%; }
  [hidden] { display:none !important; }
</style>
</head>
<body>

<header>
  <h1>Registro de Inventario</h1>
  <nav id="nav"></nav>
</header>

<main>
  <div id="aviso" class="aviso" hidden></div>
  <div id="contenedor-vistas"></div>

  <section id="vista-mantenedor" class="card" hidden>
    <h2>Mantenedor</h2>
    <div id="mant-login">
      <div class="fila-clave">
        <label style="flex:1">Clave del mantenedor<input type="password" id="mant-clave" autocomplete="off"></label>
        <button class="primario" id="mant-entrar">Entrar</button>
      </div>
      <p id="mant-login-msg" class="msg-error"></p>
    </div>
    <div id="mant-editor" class="solo-mantenedor" hidden>
      <p>Escribe un valor por línea. Al guardar, reemplaza la lista completa.</p>
      <div class="grid-cab">
        <label>Jefes de área<textarea id="m-jefes"></textarea></label>
        <label>Productos<textarea id="m-productos"></textarea></label>
        <label>Clases<textarea id="m-clases"></textarea></label>
        <label>Largos<textarea id="m-largos"></textarea></label>
        <label>Diámetro RCC<textarea id="m-diamRCC"></textarea></label>
        <label>Diámetro RC-RCI<textarea id="m-diamRC"></textarea></label>
        <label>Diámetro RD-RDI<textarea id="m-diamRD"></textarea></label>
        <label>Nivel de secado<textarea id="m-secado"></textarea></label>
      </div>
      <div class="acciones">
        <button class="primario" id="mant-guardar">Guardar mantenedor</button>
        <span id="mant-msg"></span>
      </div>
    </div>
  </section>
</main>

<datalist id="dl-jefes"></datalist>
<datalist id="dl-productos"></datalist>
<datalist id="dl-clases"></datalist>
<datalist id="dl-largos"></datalist>
<datalist id="dl-diam"></datalist>
<datalist id="dl-secado"></datalist>

<script>
/* ==== CONFIGURACION ==== */
var APPS_SCRIPT_URL = 'https://script.google.com/macros/s/AKfycbxxEiJkLVXE1Ragx7C3S62YaUZkocdihBlMsGwoc_BmAix65_O_91MUwGbbobY5hNkOeQ/exec';

var VISTAS = [
  { id: 'impregnacion', nombre: 'Impregnación' },
  { id: 'polineras',    nombre: 'Polineras' },
  { id: 'postes',       nombre: 'Postes' },
  { id: 'morbark',      nombre: 'Morbark / Cilindrado' }
];

var TRABAJADORES_MAX = 10;
var FILAS_INICIALES = 12;
var FILAS_NUEVAS = 5;

var COLUMNAS_TABLA = [
  { idx: 2, nombre: 'Fecha' }, { idx: 3, nombre: 'Jefe' }, { idx: 14, nombre: 'Producto' },
  { idx: 15, nombre: 'Clase' }, { idx: 16, nombre: 'Largo' }, { idx: 17, nombre: 'Diámetro' },
  { idx: 18, nombre: 'Producción' }, { idx: 19, nombre: 'Recuperación' }, { idx: 20, nombre: 'Rechazo' },
  { idx: 21, nombre: 'Secado' }, { idx: 22, nombre: 'Sector' }, { idx: 23, nombre: 'Comentario' }
];

var COLUMNAS_CARGA = [
  { c: 'producto',     t: 'Producto',     type: 'text',   list: 'dl-productos' },
  { c: 'clase',        t: 'Clase',        type: 'text',   list: 'dl-clases' },
  { c: 'largo',        t: 'Largo',        type: 'text',   list: 'dl-largos' },
  { c: 'diametro',     t: 'Diámetro',     type: 'text',   list: '' },
  { c: 'secado',       t: 'Secado',       type: 'text',   list: 'dl-secado' },
  { c: 'produccion',   t: 'Producción',   type: 'number', list: '' },
  { c: 'recuperacion', t: 'Recuperación', type: 'number', list: '' },
  { c: 'rechazo',      t: 'Rechazo',      type: 'number', list: '' },
  { c: 'sector',       t: 'Sector',       type: 'text',   list: '' },
  { c: 'comentario',   t: 'Comentario',   type: 'text',   list: '' }
];

var LISTAS = { jefes:[], productos:[], clases:[], largos:[], diamRCC:[], diamRC:[], diamRD:[], secado:[] };
var claveActual = '';
var contadorFilas = {};

/* ==== UTILIDADES ==== */
function $(id) { return document.getElementById(id); }

function esc(s) {
  return String(s === null || s === undefined ? '' : s).replace(/[&<>"']/g, function (c) {
    return { '&':'&amp;', '<':'&lt;', '>':'&gt;', '"':'&quot;', "'":'&#39;' }[c];
  });
}

function hoyISO() {
  var d = new Date();
  d.setMinutes(d.getMinutes() - d.getTimezoneOffset());
  return d.toISOString().slice(0, 10);
}

function mostrarAviso(texto) { var a = $('aviso'); a.textContent = texto; a.hidden = !texto; }

function llenarDatalist(id, valores) {
  $(id).innerHTML = valores.map(function (v) { return '<option value="' + esc(v) + '"></option>'; }).join('');
}

function diamOpciones(producto) {
  var p = (producto || '').trim().toUpperCase();
  if (p === 'RCC') return LISTAS.diamRCC;
  if (p === 'RC' || p === 'RCI') return LISTAS.diamRC;
  if (p === 'RD' || p === 'RDI') return LISTAS.diamRD;
  return [].concat(LISTAS.diamRCC, LISTAS.diamRC, LISTAS.diamRD).filter(function (v, i, a) { return a.indexOf(v) === i; });
}

function llamarGet(params) {
  var partes = [];
  Object.keys(params).forEach(function (k) {
    partes.push(encodeURIComponent(k) + '=' + encodeURIComponent(params[k]));
  });
  return fetch(APPS_SCRIPT_URL + '?' + partes.join('&')).then(function (r) { return r.json(); });
}

function llamarPost(cuerpo) {
  return fetch(APPS_SCRIPT_URL, {
    method: 'POST',
    headers: { 'Content-Type': 'text/plain;charset=utf-8' },
    body: JSON.stringify(cuerpo)
  }).then(function (r) { return r.json(); });
}

/* ==== CARGA DE LISTAS ==== */
function refrescarDatalists() {
  llenarDatalist('dl-jefes', LISTAS.jefes);
  llenarDatalist('dl-productos', LISTAS.productos);
  llenarDatalist('dl-clases', LISTAS.clases);
  llenarDatalist('dl-largos', LISTAS.largos);
  llenarDatalist('dl-secado', LISTAS.secado);
  llenarDatalist('dl-diam', [].concat(LISTAS.diamRCC, LISTAS.diamRC, LISTAS.diamRD));
}

function cargarListas() {
  return llamarGet({ action: 'lists' }).then(function (datos) {
    if (!datos.ok) throw new Error(datos.error || 'No se pudieron cargar las listas');
    LISTAS = datos;
    refrescarDatalists();
    VISTAS.forEach(function (v) {
      var filas = $(v.id + '-filas').querySelectorAll('tr');
      for (var i = 0; i < filas.length; i++) actualizarDiamFila(filas[i]);
    });
  });
}

/* ==== TABLA DE CARGA ==== */
function filaHtml(vid, n) {
  var id = 'r-' + vid + '-' + n;
  var h = '<tr id="' + id + '"><td class="num">' + n + '</td>';
  COLUMNAS_CARGA.forEach(function (col) {
    var list = col.c === 'diametro' ? ' list="dl-d-' + id + '"' : (col.list ? ' list="' + col.list + '"' : '');
    var extra = col.type === 'number' ? ' min="0" step="1"' : '';
    h += '<td><input class="c-' + col.c + '" type="' + col.type + '"' + list + extra + ' autocomplete="off"></td>';
  });
  h += '<td style="display:none"><datalist id="dl-d-' + id + '"></datalist></td></tr>';
  return h;
}

function htmlVista(v) {
  var p = v.id + '-';
  var trab = '';
  for (var i = 0; i < TRABAJADORES_MAX; i++) {
    var num = (i + 1 < 10 ? '0' : '') + (i + 1);
    trab += '<input id="' + p + 't' + i + '" placeholder="Trabajador ' + num + '">';
  }
  var cab = '<th>Nº</th>' + COLUMNAS_CARGA.map(function (c) { return '<th>' + esc(c.t) + '</th>'; }).join('');
  var filas = '';
  for (var k = 1; k <= FILAS_INICIALES; k++) filas += filaHtml(v.id, k);
  contadorFilas[v.id] = FILAS_INICIALES;
  return '' +
  '<section id="vista-' + v.id + '" class="card" hidden>' +
  '  <h2>' + esc(v.nombre) + '</h2>' +
  '  <div class="cabecera">' +
  '    <label>Fecha<input type="date" id="' + p + 'fecha"></label>' +
  '    <label>Jefe de área<input list="dl-jefes" id="' + p + 'jefe" placeholder="Escribe o elige"></label>' +
  '  </div>' +
  '  <details>' +
  '    <summary>Trabajadores que ayudaron a contar (ISO)</summary>' +
  '    <div class="grid-trab">' + trab + '</div>' +
  '  </details>' +
  '  <h3>Conteo</h3>' +
  '  <div class="tabla-wrap">' +
  '    <table id="' + p + 'carga"><thead><tr>' + cab + '</tr></thead>' +
  '    <tbody id="' + p + 'filas">' + filas + '</tbody></table>' +
  '  </div>' +
  '  <div class="acciones">' +
  '    <button class="secundario" id="' + p + 'agregar">Agregar ' + FILAS_NUEVAS + ' filas</button>' +
  '    <button class="primario" id="' + p + 'btn">Guardar filas</button>' +
  '    <span id="' + p + 'msg"></span>' +
  '  </div>' +
  '  <h3>Últimos registros de esta vista</h3>' +
  '  <div class="tabla-wrap historial"><table id="' + p + 'tabla"></table></div>' +
  '</section>';
}

function valorFila(tr, clase) {
  var el = tr.querySelector('.c-' + clase);
  return el ? (el.value || '').trim() : '';
}

function actualizarDiamFila(tr) {
  var dl = tr.querySelector('datalist');
  if (!dl) return;
  dl.innerHTML = diamOpciones(valorFila(tr, 'producto')).map(function (o) {
    return '<option value="' + esc(o) + '"></option>';
  }).join('');
}

function agregarFilas(vid, cantidad) {
  var html = '';
  for (var i = 0; i < cantidad; i++) {
    contadorFilas[vid] = (contadorFilas[vid] || 0) + 1;
    html += filaHtml(vid, contadorFilas[vid]);
  }
  $(vid + '-filas').insertAdjacentHTML('beforeend', html);
}

function limpiarFila(tr) {
  tr.querySelectorAll('input').forEach(function (i) { i.value = ''; });
  actualizarDiamFila(tr);
}

function valor(id) { return ($(id).value || '').trim(); }

function leerCabecera(v) {
  var p = v.id + '-';
  var trabajadores = [];
  for (var i = 0; i < TRABAJADORES_MAX; i++) {
    var t = valor(p + 't' + i);
    if (t) trabajadores.push(t);
  }
  return {
    vista: v.nombre,
    fecha: valor(p + 'fecha'),
    jefe: valor(p + 'jefe'),
    trabajadores: trabajadores
  };
}

function leerFilas(vid) {
  var trs = $(vid + '-filas').querySelectorAll('tr');
  var out = [];
  for (var i = 0; i < trs.length; i++) {
    var tr = trs[i];
    var datos = {};
    var vacia = true;
    COLUMNAS_CARGA.forEach(function (col) {
      var val = valorFila(tr, col.c);
      datos[col.c] = val;
      if (val !== '') vacia = false;
    });
    out.push({ n: tr.querySelector('td.num').textContent, tr: tr, datos: datos, vacia: vacia });
  }
  return out;
}

function filaValida(datos) {
  if (!datos.producto) return false;
  var unidades = [datos.produccion, datos.recuperacion, datos.rechazo];
  return unidades.some(function (u) { return u !== '' && Number(u) > 0; });
}

function guardarFilas(v) {
  var msg = $(v.id + '-msg'), btn = $(v.id + '-btn');
  var cab = leerCabecera(v);
  var filas = leerFilas(v.id).filter(function (f) { return !f.vacia; });
  msg.className = ''; msg.textContent = '';

  if (!cab.fecha || !cab.jefe) {
    msg.className = 'msg-error';
    msg.textContent = 'Falta la fecha o el jefe de área.';
    return;
  }
  if (filas.length === 0) {
    msg.className = 'msg-error';
    msg.textContent = 'No hay filas con datos para guardar.';
    return;
  }
  var malas = filas.filter(function (f) { return !filaValida(f.datos); }).map(function (f) { return f.n; });
  if (malas.length) {
    msg.className = 'msg-error';
    msg.textContent = 'Revisa las filas ' + malas.join(', ') + ': necesitan producto y al menos una cantidad.';
    return;
  }

  btn.disabled = true;
  var guardadas = 0;
  function siguiente(i) {
    if (i >= filas.length) {
      msg.className = 'msg-ok';
      msg.textContent = 'Se guardaron ' + guardadas + ' filas.';
      cargarRecientes(v);
      btn.disabled = false;
      return Promise.resolve();
    }
    var f = filas[i];
    var data = Object.assign({}, cab, f.datos, { trabajadores: cab.trabajadores });
    return llamarPost({ action: 'registrar', data: data }).then(function (r) {
      if (!r.ok) throw new Error('fila ' + f.n + ': ' + r.error);
      guardadas++;
      limpiarFila(f.tr);
      return siguiente(i + 1);
    });
  }
  siguiente(0).catch(function (e) {
    msg.className = 'msg-error';
    msg.textContent = 'Se guardaron ' + guardadas + ' filas. Error en ' + e.message;
    cargarRecientes(v);
    btn.disabled = false;
  });
}

function cargarRecientes(v) {
  var tabla = $(v.id + '-tabla');
  llamarGet({ action: 'recientes', vista: v.nombre }).then(function (r) {
    if (!r.ok) throw new Error(r.error);
    var cab = COLUMNAS_TABLA.map(function (c) { return '<th>' + esc(c.nombre) + '</th>'; }).join('');
    var filas = r.rows.map(function (f) {
      return '<tr>' + COLUMNAS_TABLA.map(function (c) {
        var val = f[c.idx];
        if (c.idx === 2 && val) val = String(val).slice(0, 10);
        var clase = c.idx === 23 ? ' class="comentario"' : '';
        return '<td' + clase + '>' + esc(val) + '</td>';
      }).join('') + '</tr>';
    }).join('');
    tabla.innerHTML = '<thead><tr>' + cab + '</tr></thead><tbody>' +
      (filas || '<tr><td>Sin registros aún</td></tr>') + '</tbody>';
  }).catch(function (e) {
    tabla.innerHTML = '<tr><td class="msg-error">No se pudieron cargar los registros: ' + esc(e.message) + '</td></tr>';
  });
}

function montarVistas() {
  $('contenedor-vistas').innerHTML = VISTAS.map(htmlVista).join('');
  VISTAS.forEach(function (v) {
    var p = v.id + '-';
    $(p + 'fecha').value = hoyISO();
    $(p + 'btn').addEventListener('click', function () { guardarFilas(v); });
    $(p + 'agregar').addEventListener('click', function () { agregarFilas(v.id, FILAS_NUEVAS); });
    $(p + 'filas').addEventListener('input', function (e) {
      if (e.target.classList.contains('c-producto')) actualizarDiamFila(e.target.closest('tr'));
    });
  });
}

/* ==== NAVEGACION ==== */
var SECCIONES = VISTAS.map(function (v) { return { id: 'vista-' + v.id, nombre: v.nombre }; });
SECCIONES.push({ id: 'vista-mantenedor', nombre: 'Mantenedor' });

function mostrarSeccion(id) {
  SECCIONES.forEach(function (s) {
    $(s.id).hidden = s.id !== id;
    var b = document.querySelector('[data-sec="' + s.id + '"]');
    if (b) b.classList.toggle('activo', s.id === id);
  });
  var v = VISTAS.filter(function (x) { return 'vista-' + x.id === id; })[0];
  if (v) cargarRecientes(v);
}

function montarNav() {
  $('nav').innerHTML = SECCIONES.map(function (s) {
    return '<button data-sec="' + s.id + '">' + esc(s.nombre) + '</button>';
  }).join('');
  $('nav').addEventListener('click', function (e) {
    var b = e.target.closest('button[data-sec]');
    if (b) mostrarSeccion(b.getAttribute('data-sec'));
  });
}

/* ==== MANTENEDOR ==== */
var CAMPOS_MANT = [
  ['m-jefes','jefes'], ['m-productos','productos'], ['m-clases','clases'], ['m-largos','largos'],
  ['m-diamRCC','diamRCC'], ['m-diamRC','diamRC'], ['m-diamRD','diamRD'], ['m-secado','secado']
];

function cargarEditorMantenedor() {
  CAMPOS_MANT.forEach(function (par) { $(par[0]).value = (LISTAS[par[1]] || []).join('\n'); });
}

function entrarMantenedor() {
  var clave = $('mant-clave').value;
  $('mant-login-msg').textContent = '';
  llamarPost({ action: 'verificarClave', clave: clave }).then(function (r) {
    if (!r.ok) { $('mant-login-msg').textContent = 'Clave incorrecta.'; return; }
    claveActual = clave;
    $('mant-login').hidden = true;
    $('mant-editor').hidden = false;
    cargarEditorMantenedor();
  }).catch(function (e) {
    $('mant-login-msg').textContent = 'Error de conexión: ' + e.message;
  });
}

function guardarMantenedor() {
  var listas = {};
  CAMPOS_MANT.forEach(function (par) {
    listas[par[1]] = $(par[0]).value.split('\n').map(function (s) { return s.trim(); }).filter(Boolean);
  });
  var msg = $('mant-msg');
  $('mant-guardar').disabled = true;
  msg.className = ''; msg.textContent = 'Guardando...';
  llamarPost({ action: 'guardarMantenedor', clave: claveActual, listas: listas }).then(function (r) {
    if (!r.ok) throw new Error(r.error);
    return cargarListas().then(function () {
      msg.className = 'msg-ok'; msg.textContent = 'Mantenedor guardado.';
    });
  }).catch(function (e) {
    msg.className = 'msg-error'; msg.textContent = 'No se guardó: ' + e.message;
  }).then(function () {
    $('mant-guardar').disabled = false;
  });
}

/* ==== INICIO ==== */
function iniciar() {
  montarNav();
  montarVistas();
  $('mant-entrar').addEventListener('click', entrarMantenedor);
  $('mant-clave').addEventListener('keydown', function (e) { if (e.key === 'Enter') entrarMantenedor(); });
  $('mant-guardar').addEventListener('click', guardarMantenedor);

  cargarListas().catch(function (e) {
    mostrarAviso('No se pudieron cargar las listas del mantenedor: ' + e.message);
  }).then(function () {
    mostrarSeccion('vista-' + VISTAS[0].id);
  });
}

iniciar();
</script>
</body>
</html>
